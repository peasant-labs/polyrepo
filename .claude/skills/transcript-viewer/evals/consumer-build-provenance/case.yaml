schema_version: "1.1"
name: consumer-build-provenance
expected_outcome: |
  Checks live worktrees, package manifests, consumer imports, build output, and server
  configuration as available. Distinguishes unpublished library source, built demo assets,
  published package versions, and consumer adoption rather than blaming cache by default.
  Keeps shared transcript components/styles and parsing in Fairtrade; identifies genuinely
  host-owned wiring without copying canonical implementations into Village. Plans a
  provenance-verified mounted consumer comparison against the canonical demo in both themes,
  with enough user turns to overflow the rail. Checks nearest-edge rail scrolling without
  moving main content or focus, real host slots, and retained routes/exits. Describes release
  and adoption dependencies without performing unauthorized publication, re-pin, local
  linking, edits, pushes, or merges, and flags unavailable evidence honestly.
  Where the inspected build or proposed fix actually touches rail or disclosure motion, plans
  inspectable both-direction evidence with intermediate frames and exact served-source provenance,
  distinguishing development previews from release evidence, and treats opaque fixed-width
  contents clipped by the occupied footprint as the expectation rather than an early fade. Keeps
  validation scoped to the surfaces the prompt and probe raise, particularly whether the left rail
  follows the reading position, rather than unrelated header, mobile or compact-identity changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  determine-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.use-runner }}
    steps:
      - name: Pick a runner
        id: pick
        uses: mikehardy/runner-fallback-action@dc7732f9e532c451b2527b288ba8d58fd4b0a4ca # v1.1.0
        with:
          organization: peasant-labs
          primary-runner: "self-hosted,nixos"
          fallback-runner: "ubuntu-26.04"
          fallback-on-error: true
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
      - name: Report chosen runner
        run: 'echo "chosen: ${{ steps.pick.outputs.use-runner }}"'

  tests:
    name: tests
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_AUTHOR_NAME: polyrepo ci
      GIT_AUTHOR_EMAIL: ci@polyrepo.invalid
      GIT_COMMITTER_NAME: polyrepo ci
      GIT_COMMITTER_EMAIL: ci@polyrepo.invalid
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Run shellcheck on the scripts
        run: shellcheck scripts/*

      - name: Run the bats test suite
        run: bats tests/

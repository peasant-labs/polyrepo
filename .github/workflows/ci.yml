name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  determine-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick a runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          if ! online=$(gh api /orgs/peasant-labs/actions/runners --paginate \
              --jq '.runners[] | select(.status == "online") | select(any(.labels[]; .name == "nixos")) | .name' 2>/dev/null | wc -l); then
            echo "::warning::runner availability query failed; using the fallback"
            online=0
          fi
          echo "online runners: ${online}"
          if [ "${online}" -gt 0 ]; then
            echo 'runner=["self-hosted","nixos"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-26.04"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Report chosen runner
        env:
          CHOSEN: ${{ steps.pick.outputs.runner }}
        run: 'echo "chosen: $CHOSEN"'

  tests:
    name: tests
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_AUTHOR_NAME: polyrepo ci
      GIT_AUTHOR_EMAIL: ci@polyrepo.invalid
      GIT_COMMITTER_NAME: polyrepo ci
      GIT_COMMITTER_EMAIL: ci@polyrepo.invalid
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        # Only the GitHub-hosted fallback has apt-get; the self-hosted NixOS pool
        # provides both tools through its flake, so skip the install there.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y bats shellcheck
          else
            echo "apt-get unavailable; assuming bats and shellcheck are provided by the runner"
          fi

      - name: Run shellcheck on the scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*
          else
            nix develop -c shellcheck scripts/*
          fi

      - name: Run the bats test suite
        run: |
          if command -v bats >/dev/null 2>&1; then
            bats tests/
          else
            nix develop -c bats tests/
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  determine-runner:
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@runner-router-v1
    with:
      fallback: '["ubuntu-26.04"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  tests:
    name: tests
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_AUTHOR_NAME: polyrepo ci
      GIT_AUTHOR_EMAIL: ci@polyrepo.invalid
      GIT_COMMITTER_NAME: polyrepo ci
      GIT_COMMITTER_EMAIL: ci@polyrepo.invalid
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Run shellcheck on the scripts
        run: shellcheck scripts/*

      - name: Run the bats test suite
        run: bats tests/

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-26.04
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_AUTHOR_NAME: polyrepo ci
      GIT_AUTHOR_EMAIL: ci@polyrepo.invalid
      GIT_COMMITTER_NAME: polyrepo ci
      GIT_COMMITTER_EMAIL: ci@polyrepo.invalid
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Run shellcheck on the scripts
        run: shellcheck scripts/*

      - name: Run the bats test suite
        run: bats tests/
